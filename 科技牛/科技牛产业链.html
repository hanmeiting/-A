<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>科技牛产业链 · A股映射与跟踪指标</title>
  <style>
    :root {
      --bg: #f6f4ef;
      --panel: #ffffff;
      --text: #1a1a1a;
      --muted: #5c5c5c;
      --line: #e4e0d8;
      --accent: #0f5c4c;
      --accent-soft: #e6f2ef;
      --core: #0f5c4c;
      --strong: #9a5b12;
      --flex: #3d5a80;
      --chip: #eef1f0;
      --shadow: 0 1px 0 rgba(0,0,0,.04);
      --side-w: 240px;
      --font: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--font); }
    body { min-height: 100vh; }
    a { color: var(--accent); }

    .layout {
      display: grid;
      grid-template-columns: var(--side-w) 1fr;
      min-height: 100vh;
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
      background: #1f2a27;
      color: #e8eeeb;
      padding: 20px 14px 28px;
      border-right: 1px solid #16201d;
    }
    .sidebar h1 {
      font-size: 15px;
      font-weight: 650;
      margin: 0 0 4px;
      letter-spacing: .02em;
    }
    .sidebar .sub {
      font-size: 12px;
      color: #9aaca4;
      margin-bottom: 16px;
      line-height: 1.45;
    }
    .nav-btn {
      display: block;
      width: 100%;
      text-align: left;
      border: 0;
      background: transparent;
      color: #d5e0db;
      padding: 9px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      margin-bottom: 4px;
      font-family: inherit;
    }
    .nav-btn:hover { background: rgba(255,255,255,.06); }
    .nav-btn.active {
      background: var(--accent);
      color: #fff;
      font-weight: 600;
    }
    .nav-btn .tag {
      display: inline-block;
      font-size: 10px;
      opacity: .75;
      margin-left: 6px;
    }
    .side-foot {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid rgba(255,255,255,.08);
      font-size: 11px;
      color: #8a9b94;
      line-height: 1.5;
    }

    .main {
      padding: 24px 28px 48px;
      max-width: 980px;
    }

    .hero {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 20px 22px;
      margin-bottom: 18px;
      box-shadow: var(--shadow);
    }
    .hero h2 { margin: 0 0 8px; font-size: 22px; }
    .hero p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.6; }
    .motto {
      margin-top: 12px;
      padding: 10px 12px;
      background: var(--accent-soft);
      border-radius: 8px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 600;
      line-height: 1.55;
    }

    .pills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .pill {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--chip);
      color: var(--muted);
      border: 1px solid var(--line);
    }
    .pill.core { background: #e7f3ef; color: var(--core); border-color: #cfe5dd; }
    .pill.strong { background: #f8efdf; color: var(--strong); border-color: #efd9b5; }
    .pill.flex { background: #e8eef5; color: var(--flex); border-color: #c9d6e6; }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px 20px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
    }
    .card h3 {
      margin: 0 0 12px;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .one-liner {
      font-size: 14px;
      line-height: 1.65;
      margin: 0 0 14px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th, td {
      border-bottom: 1px solid var(--line);
      padding: 9px 8px;
      text-align: left;
      vertical-align: top;
      line-height: 1.45;
    }
    th {
      color: var(--muted);
      font-weight: 600;
      font-size: 12px;
      background: #faf9f6;
    }
    tr:last-child td { border-bottom: 0; }

    .seg-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }
    .seg-tab {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      border-radius: 8px;
      padding: 7px 11px;
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
    }
    .seg-tab:hover { border-color: #b9cfc7; }
    .seg-tab.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
    }

    .seg-detail {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px 16px;
      background: #fbfaf7;
    }
    .seg-detail .title {
      font-size: 15px;
      font-weight: 650;
      margin-bottom: 6px;
    }
    .meta { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    .kv { margin: 0 0 8px; font-size: 13px; line-height: 1.55; }
    .kv b { color: var(--muted); font-weight: 600; margin-right: 6px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
    .chip {
      font-size: 12px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 3px 8px;
      color: var(--text);
    }

    .checklist { margin: 0; padding-left: 18px; }
    .checklist li { margin-bottom: 6px; font-size: 13px; line-height: 1.5; color: var(--text); }

    .flow {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      line-height: 1.7;
      white-space: pre-wrap;
      background: #111816;
      color: #d7e6df;
      border-radius: 10px;
      padding: 12px 14px;
      overflow: auto;
    }

    .disclaimer {
      font-size: 12px;
      color: var(--muted);
      margin-top: 8px;
    }

    .overview-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .ov-item {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px;
      background: #fff;
      cursor: pointer;
      text-align: left;
      font-family: inherit;
    }
    .ov-item:hover { border-color: #b9cfc7; background: var(--accent-soft); }
    .ov-item .n { font-weight: 650; font-size: 13px; margin-bottom: 4px; }
    .ov-item .d { font-size: 12px; color: var(--muted); line-height: 1.45; }

    @media (max-width: 860px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar {
        position: relative;
        height: auto;
        max-height: none;
      }
      .overview-grid { grid-template-columns: 1fr; }
      .main { padding: 16px; }
    }
  </style>
</head>

            ai: "强",
            logic: "先进制程与封装对检测需求上升。",
            names: ["中科飞测", "精测电子", "长川科技", "华峰测控"],
            metrics: ["检测设备订单", "存储/逻辑厂扩产", "国产替代率"],
            note: "与前道设备同周期，略偏验证滞后。",
          },
          {
            name: "电子材料 / 特气 / 光刻胶",
            layer: "材料",
            ai: "最强",
            logic: "扩产即耗材；认证长，一旦导入粘性强。",
            names: ["华特气体", "南大光电", "晶瑞电材", "安集科技", "雅克科技", "彤程新材"],
            metrics: ["材料验证层级", "国产化率", "晶圆厂开工", "产品单价与毛利"],
            note: "看「能不能进线」比看主题更重要。",
          },
          {
            name: "硅片 / 靶材 / 零部件",
            layer: "上游底座",
            ai: "强",
            logic: "硅片是最大耗材之一；精密零部件决定设备交付能力。",
            names: ["沪硅产业", "立昂微", "江丰电子", "正帆科技", "新莱应材", "英杰电气"],
            metrics: ["12寸硅片供需", "靶材导入", "零部件国产化", "设备厂排产"],
            note: "硅片偏全球周期，零部件偏国产替代。",
          },
        ],
        timeline: [
          ["领先", "全球/国内晶圆厂CapEx指引", "定设备年景"],
          ["同步", "招标中标、在手订单", "业绩可见度"],
          ["滞后", "材料放量、重复订单", "替代兑现"],
          ["风险", "扩产推迟、验证失败、地缘摩擦", "订单真空"],
        ],
        checklist: [
          "晶圆厂资本开支是否还在加？",
          "设备是一次性订单还是重复采购？",
          "材料到了几级验证？",
          "存储厂与逻辑厂谁在扩？",
        ],
      },
      {
        id: "metals",
        title: "AI 小金属",
        necessity: "弹性受益",
        oneLiner: "更偏资源价格与供需缺口；适合当约束指标，不宜简单当科技成长股。",
        priority: [
          ["电与PCB", "铜", "紫金矿业、洛阳钼业、西部矿业"],
          ["焊接", "锡", "锡业股份、华锡有色"],
          ["浆料/电子", "银", "兴业银锡、盛达资源"],
          ["光通信/化合物", "镓锗铟", "云南锗业、驰宏锌锗"],
          ["机电散热", "稀土", "北方稀土、金力永磁（AI拉动勿夸大）"],
        ],
        flow: `上游：矿山开采 / 伴生矿回收 / 选冶提纯 / 战略资源政策
        ↓
中游：高纯金属·靶材 / 铜箔·锡焊料·银浆 / 稀土永磁
        ↓
下游：半导体与光芯片 / PCB·MLCC / 散热机电 / 电力配套`,
        segs: [
          {
            name: "铜",
            layer: "资源",
            ai: "强",
            logic: "PCB、线缆、变压器、散热都耗铜；算力+电力共振。",
            names: ["紫金矿业", "洛阳钼业", "西部矿业", "铜陵有色"],
            metrics: ["LME铜价", "库存", "矿端供给", "电网+IDC投资"],
            note: "宏观与电网影响更大，AI是边际加分项。",
          },
          {
            name: "锡",
            layer: "资源",
            ai: "中",
            logic: "电子焊接刚需；半导体与PCB景气时弹性出现。",
            names: ["锡业股份", "华锡有色"],
            metrics: ["锡价", "缅甸/印尼供给", "电子焊料需求", "库存"],
            note: "供给扰动常比AI需求更主导价格。",
          },
          {
            name: "银",
            layer: "资源",
            ai: "中",
            logic: "导电浆料与电子触点；常与光伏电子共振。",
            names: ["兴业银锡", "盛达资源", "银邦股份"],
            metrics: ["银价", "光伏浆料耗量", "电子消费", "库存"],
            note: "金融属性强，科技映射弱于铜锡。",
          },
          {
            name: "镓 / 锗 / 铟",
            layer: "小金属",
            ai: "中",
            logic: "化合物半导体、光纤相关；出口管制可放大波动。",
            names: ["云南锗业", "驰宏锌锗", "株冶集团"],
            metrics: ["出口政策", "光纤/化合物需求", "价格", "库存"],
            note: "体量小、波动大，政策市特征明显。",
          },
          {
            name: "稀土 / 永磁",
            layer: "材料",
            ai: "弱",
            logic: "机房风机电机有永磁需求，但主逻辑仍在新能源车与风电。",
            names: ["北方稀土", "金力永磁", "宁波韵升", "正海磁材"],
            metrics: ["稀土价格", "新能源车销量", "风电装机", "IDC电机增量（次要）"],
            note: "不要夸大AI对稀土的拉动。",
          },
        ],
        timeline: [
          ["领先", "矿山供给、出口管制、宏观流动性", "定价主导"],
          ["同步", "现货价、库存、升贴水", "交易层面"],
          ["科技验证", "PCB/电力/光通信真实耗量", "辨认真假AI逻辑"],
          ["风险", "把周期股当成长股高估值", "回撤大"],
        ],
        checklist: [
          "价格上涨是供给收缩还是AI耗量？",
          "库存高不高？",
          "有没有出口管制催化？",
          "估值是否已经透支资源红利？",
        ],
      },
    ];

    const state = { chainId: "overview", segIdx: 0 };

    function necessityClass(n) {
      if (n === "核心刚需") return "core";
      if (n === "强配套") return "strong";
      return "flex";
    }

    function renderNav() {
      const list = document.getElementById("nav-list");
      list.innerHTML = CHAINS.map((c) => {
        const active = state.chainId === c.id ? "active" : "";
        return `<button class="nav-btn ${active}" data-id="${c.id}">${c.title}<span class="tag">${c.necessity}</span></button>`;
      }).join("");

      document.querySelectorAll(".nav-btn").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.id === state.chainId);
        btn.onclick = () => {
          state.chainId = btn.dataset.id;
          state.segIdx = 0;
          render();
        };
      });
    }

    function tableHTML(headers, rows) {
      return `<table><thead><tr>${headers.map((h) => `<th>${h}</th>`).join("")}</tr></thead>
        <tbody>${rows.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
    }

    function renderOverview() {
      return `
        <div class="hero">
          <h2>本轮科技牛：产业链全景</h2>
          <p>按「发展 AI 是否缺它」梳理十个细分。左侧点选进入详情，详情里再点具体环节。</p>
          <div class="motto">芯片定上限 → HBM 定带宽 → 光模块/CPO 定集群 → PCB/MLCC 定底板 → 液冷/电力定落地 → 设备材料定扩产</div>
          <div class="pills">
            <span class="pill core">核心刚需 ×5</span>
            <span class="pill strong">强配套 ×4</span>
            <span class="pill flex">弹性受益 ×1</span>
          </div>
        </div>

        <div class="card">
          <h3>必要程度分层</h3>
          ${tableHTML(
            ["必要程度", "环节", "为什么必须"],
            [
              ["核心刚需", "算力芯片、HBM、先进封装、光通信/CPO、设备材料", "没有这些，集群建不起来或扩不动"],
              ["强配套", "PCB/CCL、MLCC、服务器/液冷/IDC、电源电力", "芯片要装进整机、机柜、机房才能变现"],
              ["弹性受益", "AI小金属", "用量与价格弹性，更偏资源约束"],
            ]
          )}
        </div>

        <div class="card">
          <h3>点选进入细分</h3>
          <div class="overview-grid">
            ${CHAINS.map(
              (c) => `<button class="ov-item" data-jump="${c.id}">
                <div class="n">${c.title} · ${c.necessity}</div>
                <div class="d">${c.oneLiner}</div>
              </button>`
            ).join("")}
          </div>
        </div>

        <p class="disclaimer">列举公司为市场常见映射举例，用于产业对照学习，不构成投资建议。</p>
      `;
    }

    function renderChain(c) {
      const seg = c.segs[state.segIdx] || c.segs[0];
      return `
        <div class="hero">
          <h2>${c.title}</h2>
          <p>${c.oneLiner}</p>
          <div class="pills">
            <span class="pill ${necessityClass(c.necessity)}">${c.necessity}</span>
            <span class="pill">共 ${c.segs.length} 个环节</span>
          </div>
        </div>

        <div class="card">
          <h3>观察优先级（非荐股）</h3>
          ${tableHTML(["优先级", "环节", "A股常见映射举例"], c.priority)}
        </div>

        <div class="card">
          <h3>环节明细 · 点选查看</h3>
          <div class="seg-tabs">
            ${c.segs
              .map(
                (s, i) =>
                  `<button class="seg-tab ${i === state.segIdx ? "active" : ""}" data-seg="${i}">${s.name}</button>`
              )
              .join("")}
          </div>
          <div class="seg-detail">
            <div class="title">${seg.name}</div>
            <div class="meta">
              <span class="pill">${seg.layer}</span>
              <span class="pill core">AI相关度 ${seg.ai}</span>
            </div>
            <p class="kv"><b>逻辑</b>${seg.logic}</p>
            <p class="kv"><b>A股常见映射</b></p>
            <div class="chips">${seg.names.map((n) => `<span class="chip">${n}</span>`).join("")}</div>
            <p class="kv" style="margin-top:10px"><b>跟踪指标</b></p>
            <div class="chips">${seg.metrics.map((m) => `<span class="chip">${m}</span>`).join("")}</div>
            <p class="kv" style="margin-top:10px"><b>备注</b>${seg.note}</p>
          </div>
        </div>

        <div class="card">
          <h3>上下游简图</h3>
          <div class="flow">${c.flow}</div>
        </div>

        <div class="card">
          <h3>指标时间轴</h3>
          ${tableHTML(["时效", "看什么", "含义"], c.timeline)}
        </div>

        <div class="card">
          <h3>检查清单</h3>
          <ul class="checklist">${c.checklist.map((x) => `<li>${x}</li>`).join("")}</ul>
        </div>

        <p class="disclaimer">仅研究梳理，不构成投资建议。景气以订单、价格、库存、资本开支验证为准。</p>
      `;
    }

    function render() {
      renderNav();
      const app = document.getElementById("app");
      if (state.chainId === "overview") {
        app.innerHTML = renderOverview();
        app.querySelectorAll("[data-jump]").forEach((el) => {
          el.onclick = () => {
            state.chainId = el.dataset.jump;
            state.segIdx = 0;
            render();
            window.scrollTo({ top: 0, behavior: "smooth" });
          };
        });
        return;
      }
      const chain = CHAINS.find((c) => c.id === state.chainId) || CHAINS[0];
      app.innerHTML = renderChain(chain);
      app.querySelectorAll("[data-seg]").forEach((el) => {
        el.onclick = () => {
          state.segIdx = Number(el.dataset.seg);
          render();
        };
      });
    }

    render();
  </script>
</body>
</html>
